# ── MenúGO — Configuración Nginx para Producción ─────────────────────────────
# Archivo: /etc/nginx/sites-available/menugo
#
# Uso:
#   cp deploy/nginx.conf /etc/nginx/sites-available/menugo
#   ln -s /etc/nginx/sites-available/menugo /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# IMPORTANTE: reemplazar menugo.com.co con el dominio real

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name menugo.com.co www.menugo.com.co *.menugo.com.co;

    return 301 https://$host$request_uri;
}

# ── HTTPS — dominio central + wildcard subdominios de tenants ─────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name menugo.com.co www.menugo.com.co *.menugo.com.co;

    root /var/www/menugo/public;
    index index.php;

    # SSL — generado por Certbot (ver deploy/ssl-setup.sh)
    ssl_certificate     /etc/letsencrypt/live/menugo.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menugo.com.co/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Headers de seguridad ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Build de Vite (assets con hash — caché largo) ─────────────────────────
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Storage público (imágenes, logos) ─────────────────────────────────────
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Bloquear archivos sensibles ───────────────────────────────────────────
    location ~ /\.env         { deny all; return 404; }
    location ~ /\.git         { deny all; return 404; }
    location ~ /composer\.    { deny all; return 404; }
    location ~ /artisan       { deny all; return 404; }
    location ~ /package\.json { deny all; return 404; }

    # ── Laravel / Inertia — todas las rutas al index.php ─────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    location ~ /\.ht { deny all; }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/menugo_access.log;
    error_log  /var/log/nginx/menugo_error.log;
}
